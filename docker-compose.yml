# Stack local del BFF y los microservicios que consume.
# El API Gateway propio (api.gateway.cuidadoseguro) ya no participa:
# en produccion el punto de entrada publico es AWS API Gateway.
services:
  bff:
    build:
      context: .
      dockerfile: dockerfile
    container_name: bff
    image: ${DOCKERHUB_USERNAME:-local}/bff-cuidadoseguro:${TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:8081
      PACIENTES_SERVICE_URL: http://pacientes:8082
      DATOS_MEDICOS_SERVICE_URL: http://datosmedicos-service:8083
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    ports:
      - "8090:8090"
    networks:
      - cuidadoseguro
    depends_on:
      - auth-service
      - pacientes
      - datosmedicos-service

  auth-service:
    image: ${DOCKERHUB_USERNAME:-local}/auth-service:${TAG:-latest}
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    networks:
      - cuidadoseguro

  pacientes:
    image: ${DOCKERHUB_USERNAME:-local}/pacientes:${TAG:-latest}
    container_name: pacientes
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8082:8082"
    networks:
      - cuidadoseguro

  datosmedicos-service:
    image: ${DOCKERHUB_USERNAME:-local}/datosmedicos-service:${TAG:-latest}
    container_name: datosmedicos-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8083:8083"
    networks:
      - cuidadoseguro

networks:
  cuidadoseguro:
    driver: bridge
