server.port=${SERVER_PORT:8090}

# En produccion no hay valores por defecto: las URLs internas se inyectan
# como variables de entorno en la definicion de tarea (ECS).
auth.url=${AUTH_SERVICE_URL}
pacientes.url=${PACIENTES_SERVICE_URL}
datosmedicos.url=${DATOS_MEDICOS_SERVICE_URL}

# El navegador nunca llama al BFF en produccion: entra por AWS API Gateway,
# que es quien resuelve el CORS. Se deja vacio para no habilitar origenes.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

logging.level.com.cuidadoseguro=INFO
