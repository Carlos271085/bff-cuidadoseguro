spring.application.name=bff-cuidadoseguro

server.port=8090

# URLs internas de los microservicios (perfil local por defecto).
# El BFF es el unico componente que las conoce.
auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
pacientes.url=${PACIENTES_SERVICE_URL:http://localhost:8082}
datosmedicos.url=${DATOS_MEDICOS_SERVICE_URL:http://localhost:8083}

# Origenes permitidos para llamadas directas al BFF (desarrollo local).
# En produccion el CORS lo resuelve AWS API Gateway.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

spring.main.web-application-type=reactive
